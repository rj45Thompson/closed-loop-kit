# Everything the learned parts are trained for. A new goal is a new row; a goal that stops is marked retired with its reason and stays.
# gnn_goals.py reads this, adds what the records say, and refuses a job in the records that no row here claims.
projects:
  shops: One game feature
  selfmodel: The tool's own code
rules:
  kills: a count of which tests catch its breaks
  effects: what each method is seen to do
  words: shared words
  popular: the tests that catch the most
  operator prior: how often that kind of break survived
# what stands behind each plain rule: when a rule beats a goal, the goal can ask for that as an input
rule_stats:
  kills: killed
  effects: effects
  words: the words on each node
  popular: test_kills_top
  operator prior: kills_by_operator
records:
  morph: Each pass of the loop
  gnn_tasks: Each goal's evidence
  survivor_rank: The ranking of breaks
  loop_ticks: Each improvement tick
  gnn_curve: How full the graph must be
  run_plan: The run plan
  e1_3_gnn: Goals at more seeds
  e1_3_cheap: Goals at more seeds
  e1_3_plain: Goals at more seeds
  gnn_tune: Each reshaping of the graph
  verdicts: Each break's verdict
  gnn_view: What the network is allowed to read
  own_graph: Each part on a graph of itself
goals:
  - id: owner
    trained_to: Who owns new code
    learns: maps to
    model: graph network
    file: graph_gnn.py
    symbol: class LinkProposer
    jobs: [owner as today]
    note: Its own selftest still passes with the guard that keeps the answer out removed. Only a new guard catches that.
    asked_by: the project owner, for linking code to requirements
    state: trained
  - id: tests
    trained_to: Which tests catch a break
    learns: killed by
    model: graph network
    file: gnn_tasks.py
    symbol: def job_tests
    jobs: [tests]
    asked_by: the project owner, when asked what else a graph network could do
    state: trained
  - id: steps
    trained_to: Which steps carry a requirement
    learns: binds requirement
    model: graph network
    file: gnn_tasks.py
    symbol: def job_steps
    jobs: [steps]
    asked_by: the project owner, when asked what else a graph network could do
    state: trained
  - id: equivalent
    trained_to: Which breaks change nothing
    learns: the breaks proven the same program
    model: small model on the break's features
    file: gnn_tasks.py
    symbol: def job_equivalent
    jobs: [equivalent]
    doubts:
      - project: selfmodel
        why: Its labels come from before a fix to how breaks are compared. 88 of its 94 examples are statements holding a comprehension, generator or lambda, so it probably learned the statement's shape, not the break. Inferred, not re-run.
      - why: Every example it learns from is a break a pass already removes, so its score says nothing about the survivors a person reads.
    asked_by: the project owner, when asked what else a graph network could do
    state: trained
  - id: break_order
    trained_to: Which breaks will get past the tests
    learns: the breaks of earlier passes
    model: small model on the break's features
    file: survivor_rank.py
    symbol: def recall_at
    jobs: [break order]
    note: The code that writes this score is not held by a test yet. All 32 breaks of it got past.
    asked_by: a brainstorm tick
    state: trained
  - id: hint
    trained_to: Where to add a test
    learns: the same model as break order
    file: survivor_rank.py
    symbol: def hint
    jobs: []
    asked_by: a brainstorm tick
    state: uses another
    uses: break_order
  - id: second_opinion
    trained_to: A second opinion on every claim
    learns: the owner rankers, applied to what an agent claimed
    file: null
    symbol: null
    jobs: []
    asked_by: a blind grader's finding, an agent that closed its holes without meeting the intent
    state: planned
    board: GN-7
  - id: impact
    trained_to: What a change will break, before the run
    learns: calls and caught by
    file: gnn_tasks.py
    symbol: def record_impact
    jobs: []
    asked_by: the project owner, when asked what else a graph network could do
    state: planned
    board: GN-3
  - id: changed_together
    trained_to: Which methods change together
    learns: change history
    file: gnn_tasks.py
    symbol: def record_cochange
    jobs: []
    asked_by: the project owner, when asked what else a graph network could do
    state: planned
    board: GN-6
  - id: improvement
    trained_to: Which action moves which stat
    learns: the improvement graph's measured outcomes
    file: null
    symbol: null
    jobs: []
    asked_by: the project owner, for a recursive graph of the improvement itself
    state: planned
    board: RC-5
    waits_for: 20 measured outcomes
# patterns found by a run of their own, with what they rest on
patterns_found:
  - text: Goals where each answer belongs to about one source, in a sparse table, beat a plain rule far more often than the rest. That says where plain rules are weak, not where work is saved.
    rests_on: right 80% of the time against a 48% base, on 44 goals across 5 graphs, and 6 of 7 on goals sealed before they ran (an anecdote at that size)
  - text: No rule was found that picks the goals which save work. All 60 of the best candidates were chance or anecdote.
    rests_on: 52 goals with a measured saving, across 5 domains
  - text: Ordering tests by a plain rule already saves most of what ordering them can. A learned order beat it on only 2 of 10 goals.
    rests_on: 10 goals, 31% against 33% saved
# what was tried and did not work, kept so nobody has to find it out twice
attempts:
  - title: Turning a goal into a vector that points at something good
    result: A goal became a list of numbers measured before any training, and a direction was fitted to what paid off, then tested on graphs it had never seen, with its bars and its predictions committed before the results. There is a weak direction for what a network can learn, and it held up on goals sealed in advance, 9 graphs of 10. There is none for what saves work. The two point about 95 degrees apart, so learnable and useful are different questions. The direction could also be gamed by copying a goal's sources, and it ranked a random relation high. It rests on 13 graphs in 5 domains, which can show a direction is not general but cannot show one is. So no goal is picked this way, and a person or a tick still decides.
# what a goal may read, tried and judged: these are adjustments to a goal, never goals of their own
variants:
  - job: owner + calls
    of: owner
    adds: calls
  - job: owner + caught by
    of: owner
    adds: caught by
  - job: owner + both
    of: owner
    adds: calls and caught by
# relations that are the graph's own bookkeeping: nothing to learn from predicting them
structure:
  in space: names the space a cell belongs to
  is at: placed by the code itself
  mutated as: made by the tool
  has step: written in the use case
  has extension: written in the use case
  reasons: a chain's own steps
  branches at: written in the use case
  rejoins: written in the use case
  gulf of evaluation: written in the use case
  gulf of execution: written in the use case
  branches on: read from the code
  asked by: written in the model
  answered by: written in the model
  performed by: written in the model
  child of: written in the model
  sets: read from the code
  includes: written in the model
  names: read from the code
  binds: read from the code
# how many links a relation needs before it is worth proposing as a goal
candidate_links: 20
